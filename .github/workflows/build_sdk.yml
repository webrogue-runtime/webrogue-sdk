name: Build Webrogue SDK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Submodules
      run: |
        git submodule update --init --single-branch builder/wasi-sdk
        git -C builder/wasi-sdk fetch --tags https://github.com/WebAssembly/wasi-sdk.git
        git -C builder/wasi-sdk submodule update --init --single-branch --depth=1 src/llvm-project src/wasi-libc src/config
        git submodule update --init --single-branch --depth=1
        git -C libraries/glib submodule update --init --single-branch --depth=1 subprojects/gvdb
  
    - name: Download prebuilt WASI-SDK
      run: |
        sh package/wasi-sdk-prebuilt/download.sh

    - name: Build WASI sysroot
      run: |
        WEBROGUE_SDK_PREBUILT_WASI_SDK=1 sh builder/build_wasi_sdk.sh
  
    - name: Build libraries
      run: |
        WEBROGUE_SDK_UNCACHED=1 sh build.sh

    - name: Build examples
      run: |
        sh examples/make_image.sh
        sh examples/build.sh

    - name: Archive SDK
      run: |
        tar czf webrogue-sdk-x86_64-linux.tar.gz -C package/ webrogue-sdk-x86_64-linux/
        tar czf webrogue-sdk-arm64-linux.tar.gz -C package/ webrogue-sdk-arm64-linux/

        cd package/ && zip -r ../webrogue-sdk-x86_64-windows.zip webrogue-sdk-x86_64-windows && cd ..

        tar czf webrogue-sdk-x86_64-macos.tar.gz -C package/ webrogue-sdk-x86_64-macos/
        tar czf webrogue-sdk-arm64-macos.tar.gz -C package/ webrogue-sdk-arm64-macos/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          webrogue-sdk-x86_64-linux.tar.gz
          webrogue-sdk-arm64-linux.tar.gz
          webrogue-sdk-x86_64-windows.zip
          webrogue-sdk-x86_64-macos.tar.gz
          webrogue-sdk-arm64-macos.tar.gz
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
